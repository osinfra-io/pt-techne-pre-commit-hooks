name: Go Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: "Go: Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version: 1.26.2

      - name: Lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9.2.1
        with:
          install-mode: goinstall
          version: 66496a99757549ab02ffbadeea72d9eb9d387fc5  # v2.2.1

      - name: Build
        run: go build ./...

      - name: Run tests and save output
        run: |
          set -o pipefail
          go test -race ./... | tee test-results.txt
          go test -race -coverprofile=cover.out ./...
          go tool cover -func=cover.out | tee coverage.txt

      - name: Add test results to summary
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const testResults = fs.readFileSync('test-results.txt', 'utf8');
            const coverage = fs.readFileSync('coverage.txt', 'utf8');
            core.summary
              .addHeading('Go Test Results')
              .addCodeBlock(testResults)
              .addHeading('Coverage Summary')
              .addCodeBlock(coverage)
              .write();

  regal:
    name: "Rego: Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Regal
        uses: StyraInc/setup-regal@33a142b1189004e0f14bf42b15972c67eecce776  # v1.0.0
        with:
          version: v0.40.0

      - name: Lint policies
        run: regal lint internal/tofuscan/policies
